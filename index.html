<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CampusCycle</title>
<style>
  /* Chatbot button */
  #chatbot-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background-color: #f5f5dc; /* beige */
    color: #4b3e2b; /* dark brown text */
    border: none;
    border-radius: 50%;
    width: 60px;
    height: 60px;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    z-index: 1000;
  }

  /* Chatbot window */
  #chatbot-container {
    display: none;
    position: fixed;
    bottom: 90px;
    right: 20px;
    width: 320px;
    max-height: 450px;
    background: #fff8dc; /* lighter beige */
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    overflow: hidden;
    z-index: 1000;
    flex-direction: column;
    font-family: Arial, sans-serif;
  }

  #chatbot-header {
    background: #f5f5dc;
    color: #4b3e2b;
    padding: 10px;
    text-align: center;
    font-weight: bold;
    position: relative;
  }

  #chatbot-header button {
    position: absolute;
    right: 10px;
    top: 5px;
    background: transparent;
    border: none;
    font-size: 16px;
    cursor: pointer;
    color: #4b3e2b;
  }

  #chatbot-messages {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    font-size: 14px;
    display: flex;
    flex-direction: column;
  }

  .bot-message {
    background: #fff5e1;
    padding: 8px;
    margin: 5px 0;
    border-radius: 5px;
    width: fit-content;
    max-width: 80%;
  }

  .user-message {
    background: #dcd0b0;
    padding: 8px;
    margin: 5px 0;
    border-radius: 5px;
    align-self: flex-end;
    width: fit-content;
    max-width: 80%;
  }

  #chatbot-input {
    display: flex;
    border-top: 1px solid #ccc;
  }

  #chatbot-input input {
    flex: 1;
    border: none;
    padding: 8px;
    font-size: 14px;
  }

  #chatbot-input button {
    background: #f5f5dc;
    color: #4b3e2b;
    border: none;
    padding: 8px 12px;
    cursor: pointer;
  }

  .quick-reply {
    background: #f0e4c2;
    border: none;
    border-radius: 5px;
    padding: 5px 10px;
    margin: 3px 3px 0 0;
    cursor: pointer;
    font-size: 13px;
  }

  .typing {
    font-style: italic;
    font-size: 12px;
    color: #4b3e2b;
  }
</style>
</head>
<body>

<!-- Chatbot Button -->
<button id="chatbot-btn">💬</button>

<!-- Chatbot Container -->
<div id="chatbot-container">
  <div id="chatbot-header">
    CampusCycle Bot 🤖
    <button id="chatbot-close">✖</button>
  </div>
  <div id="chatbot-messages"></div>
  <div id="chatbot-input">
    <input type="text" id="chatbot-text" placeholder="Type your message..." />
    <button id="chatbot-send">Send</button>
  </div>
</div>

<script>
  const chatbotBtn = document.getElementById('chatbot-btn');
  const chatbotContainer = document.getElementById('chatbot-container');
  const chatbotMessages = document.getElementById('chatbot-messages');
  const chatbotText = document.getElementById('chatbot-text');
  const chatbotSend = document.getElementById('chatbot-send');
  const chatbotClose = document.getElementById('chatbot-close');

  // Toggle chatbot
  chatbotBtn.addEventListener('click', () => {
    chatbotContainer.style.display = chatbotContainer.style.display === 'none' || chatbotContainer.style.display === '' ? 'flex' : 'none';
  });
  chatbotClose.addEventListener('click', () => chatbotContainer.style.display = 'none');

  // Add message function
  function addMessage(text, sender) {
    const msgDiv = document.createElement('div');
    msgDiv.className = sender === 'bot' ? 'bot-message' : 'user-message';
    msgDiv.innerHTML = text;
    chatbotMessages.appendChild(msgDiv);
    chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
  }

  // Bot reply logic
  function botReply(msg) {
    const typing = document.createElement('div');
    typing.className = 'typing';
    typing.innerText = 'CycleBot is typing...';
    chatbotMessages.appendChild(typing);
    chatbotMessages.scrollTop = chatbotMessages.scrollHeight;

    setTimeout(() => {
      typing.remove();
      let reply = "I'm not sure I understood. Can you try again? 🤔";

      if (msg.includes('hello') || msg.includes('hi')) {
        reply = "👋 Hello! I'm CycleBot. How can I help you?<br>";
        addMessage(reply, 'bot');
        const options = ['Buy', 'Sell', 'PG', 'Help'];
        const btnContainer = document.createElement('div');
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'quick-reply';
          btn.innerText = opt;
          btn.onclick = () => { sendQuick(opt.toLowerCase()) };
          btnContainer.appendChild(btn);
        });
        chatbotMessages.appendChild(btnContainer);
        chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
        return;
      }
      else if (msg.includes('buy')) reply = "You can browse second-hand items here 👉 <a href='#'>Buy Page</a>";
      else if (msg.includes('sell')) reply = "To sell your item, go to the Sell page 👉 <a href='#'>Sell Page</a>";
      else if (msg.includes('pg') || msg.includes('hostel')) reply = "Looking for PG? Check our map 👉 <a href='#'>PG Map</a>";
      else if (msg.includes('help') || msg.includes('faq')) reply = "I can help you with:<br>- Buying items<br>- Selling items<br>- Finding PGs<br>- Messaging users";

      addMessage(reply, 'bot');
    }, 800);
  }

  // Send message
  function sendMessage() {
    const userMsg = chatbotText.value.trim();
    if (!userMsg) return;
    addMessage(userMsg, 'user');
    chatbotText.value = '';
    botReply(userMsg.toLowerCase());
  }

  // Quick reply handler
  function sendQuick(msg) {
    addMessage(msg, 'user');
    botReply(msg);
  }

  // Event listeners
  chatbotSend.addEventListener('click', sendMessage);
  chatbotText.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

  // Auto greeting on load
  window.onload = () => {
    setTimeout(() => {
      addMessage("👋 Hi! I'm CycleBot. How can I assist you today?", 'bot');
    }, 1000);
  };
</script>
</body>
</html>
