<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Registration Form</title>
  <link rel="stylesheet" href="style2.css" />
</head>

<body>
  <section class="container">
    <header>Registration Form</header>
    <form id="signupForm" class="form">
      <!-- Full Name -->
      <div class="input-box">
        <label>Full Name</label>
        <input type="text" id="fullname" placeholder="Enter full name" required />
      </div>

      <!-- Email -->
      <div class="input-box">
        <label>Email Address</label>
        <input type="email" id="email" placeholder="Enter email address" required />
      </div>

      <!-- Username -->
      <div class="input-box">
        <label>User Name</label>
        <input type="text" id="username" placeholder="Enter user name" required />
      </div>

      <!-- Password Section -->
      <div class="column">
        <div class="input-box">
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter password" required />
        </div>
        <div class="input-box">
          <label>Confirm Password</label>
          <input type="password" id="confirm-password" placeholder="Confirm password" required />
        </div>
      </div>

      <!-- Phone + Birth Date -->
      <div class="column">
        <div class="input-box">
          <label>Phone Number</label>
          <input type="tel" id="phone" placeholder="Enter phone number" required />
        </div>
        <div class="input-box">
          <label>Birth Date</label>
          <input type="date" id="birthdate" required />
        </div>
      </div>

      <!-- Gender -->
      <div class="gender-box">
        <h3>Gender</h3>
        <div class="gender-option">
          <div class="gender">
            <input type="radio" id="check-male" name="gender" value="Male" checked />
            <label for="check-male">Male</label>
          </div>
          <div class="gender">
            <input type="radio" id="check-female" name="gender" value="Female" />
            <label for="check-female">Female</label>
          </div>
          <div class="gender">
            <input type="radio" id="check-other" name="gender" value="Other" />
            <label for="check-other">Prefer not to say</label>
          </div>
        </div>
      </div>

      <!-- Address -->
      <div class="input-box address">
        <label>Address</label>
        <input type="text" id="street" placeholder="Enter street address" required />
        <div class="column">
          <input type="text" id="city" placeholder="Enter your city" required />
          <input type="text" id="state" placeholder="Enter your state/region" required />
        </div>
      </div>

      <!-- Submit -->
      <button type="submit">Submit</button>
      <p>Already have an account? <a href="index.html">Login here</a></p>
    </form>
  </section>

  <script>
    const signupForm = document.getElementById("signupForm");

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("fullname").value.trim();
      const email = document.getElementById("email").value.trim();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const confirmPassword = document.getElementById("confirm-password").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const birthdate = document.getElementById("birthdate").value;
      const gender = document.querySelector('input[name="gender"]:checked').value;
      const street = document.getElementById("street").value.trim();
      const city = document.getElementById("city").value.trim();
      const state = document.getElementById("state").value.trim();

      // Validation
      if (!email.endsWith("@apsit.edu.in")) {
        return alert("Only @apsit.edu.in emails are allowed ❌");
      }
      if (password !== confirmPassword) {
        return alert("Passwords do not match ❌");
      }
      const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$/;
      if (!passwordPattern.test(password)) {
        return alert("Password must have 8+ chars, uppercase, lowercase, number & special char ❌");
      }

      try {
        const res = await fetch("http://localhost:3000/api/auth/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, username, password, phone, birthdate, gender, street, city, state }),
        });

        const data = await res.json();

        if (res.ok) {
          alert("✅ Signup successful! Redirecting to login...");
          window.location.href="./index.html"; // Redirect to login
        } else {
          alert("❌ " + data.error);
        }
      } catch (err) {
        alert("Server error: " + err.message);
      }
    });
  </script>
</body>
</html>
